<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全钢模具管理台账 · 查询与编辑工具</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232e6da4'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%231c2a3a'/%3E%3Cpath d='M4 16h5M23 16h5M16 4v5M16 23v5' stroke='%23eef2f5' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef2f5;
  --panel:#ffffff;
  --ink:#1d2b38;
  --ink2:#5a6b7b;
  --ink3:#8a98a6;
  --line:#ccd7e1;
  --line2:#e4ebf1;
  --accent:#2e6da4;
  --accent-d:#1f4f7c;
  --accent-soft:#e2eef9;
  --warn:#b45309;
  --warn-soft:#fdf3e3;
  --ok:#1e7f4f;
  --ok-soft:#e5f4ec;
  --danger:#b3372e;
  --danger-soft:#fbeae8;
  --header-bg:#1c2a3a;
  --header-ink:#eaf1f7;
  --th-bg:#dde6ee;
  --zebra:#f6f9fb;
  --sel:#dfedf9;
  --radius:6px;
  --shadow:0 1px 3px rgba(28,42,58,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--ink)}
svg{display:block}

/* ===== 顶栏 ===== */
.topbar{
  background:var(--header-bg);color:var(--header-ink);
  display:flex;align-items:center;gap:14px;padding:0 18px;height:56px;flex:none;
  position:relative;z-index:30;
}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 32%,#7ea6c8 100%);}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-icon{width:34px;height:34px;flex:none}
.brand h1{font-size:17px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.brand .sub{font-size:11px;color:#9db3c7;margin-top:1px;white-space:nowrap}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.save-state{display:flex;align-items:center;gap:6px;font-size:12px;color:#b9c9d8;padding:0 6px;white-space:nowrap}
.save-state .dot{width:8px;height:8px;border-radius:50%;background:#6b7f92}
.save-state.ok .dot{background:#4caf7d}
.save-state.warn .dot{background:#e0a33a}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--radius);
  font-size:13px;font-weight:600;background:transparent;color:#cddbe8;border:1px solid #38506a;
  transition:background .12s,border-color .12s,color .12s;
}
.btn:hover{background:#27394e;color:#fff;border-color:#4a6480}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
.btn.ghost{color:var(--accent);border-color:#b9cfe3}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent-d)}
.btn.danger{color:var(--danger);border-color:#e3b8b4}
.btn.danger:hover{background:var(--danger-soft)}
.btn.small{padding:4px 9px;font-size:12px}

/* ===== 主体布局 ===== */
.main{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.tabs{display:flex;gap:2px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 12px;flex:none;overflow-x:auto}
.tab{
  padding:11px 16px 10px;font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap;
  border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px;
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .cnt{font-size:11px;font-weight:600;background:var(--line2);color:var(--ink2);border-radius:10px;padding:1px 7px}
.tab.active .cnt{background:var(--accent-soft);color:var(--accent)}

.toolbar{
  background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:none;
}
.search-box{position:relative;flex:1 1 240px;min-width:200px;max-width:420px}
.search-box svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink3)}
.search-box input{
  width:100%;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:var(--radius);
  background:#fbfcfe;outline:none;transition:border-color .12s,box-shadow .12s;
}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,109,164,.14);background:#fff}
.filter-add{display:flex;gap:6px;align-items:center}
.filter-add select{
  padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;max-width:160px;outline:none;
}
.tool-spacer{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%;padding-top:2px}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--accent-soft);
  color:var(--accent-d);border:1px solid #c4dcf0;border-radius:14px;padding:3px 8px 3px 10px;font-weight:600;
}
.chip button{color:var(--accent-d);opacity:.7;font-size:13px;line-height:1;padding:0 2px}
.chip button:hover{opacity:1}
.chip.plain{background:var(--line2);color:var(--ink2);border-color:var(--line)}

.result-meta{
  background:var(--panel);border-bottom:1px solid var(--line);padding:6px 14px;
  display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);flex:none;flex-wrap:wrap;
}
.result-meta b{color:var(--ink)}
.pager{margin-left:auto;display:flex;align-items:center;gap:4px}
.pager button{
  width:26px;height:26px;border:1px solid var(--line);border-radius:5px;background:#fff;
  display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);font-size:12px;
}
.pager button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.pager button:disabled{opacity:.4;cursor:default}
.pager .pg-num{min-width:90px;text-align:center;font-size:12px;color:var(--ink2)}

/* ===== 表格 ===== */
.tbl-wrap{flex:1;overflow:auto;background:var(--panel);position:relative}
table{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
thead th{
  position:sticky;top:0;z-index:5;background:var(--th-bg);color:var(--ink);
  font-weight:700;padding:8px 9px;border-bottom:1px solid var(--line);border-right:1px solid #d3dde6;
  white-space:nowrap;text-align:left;font-size:12.5px;user-select:none;
}
thead th.sortable{cursor:pointer}
thead th.sortable:hover{background:#d3dee9}
thead th .arr{font-size:10px;color:var(--accent);margin-left:3px}
thead th .col-hide{font-size:10px;color:var(--ink3);font-weight:400;margin-left:4px}
tbody td{
  padding:5px 9px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;vertical-align:top;
  font-variant-numeric:tabular-nums;
}
tbody td.wrap{white-space:pre-wrap;word-break:break-all;line-height:1.5}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:hover td{background:#f0f6fb}
tbody tr.sel td{background:var(--sel)}
td.cell{cursor:cell;position:relative}
td.cell:hover::after{content:"";position:absolute;inset:1px;border:1px solid rgba(46,109,164,.55);pointer-events:none}
td.empty{color:var(--ink3)}
td.num{text-align:right}
.cbx{width:34px;text-align:center;padding:5px 4px}
.cbx input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;vertical-align:middle}
.row-ops{width:76px;text-align:center;white-space:nowrap}
.row-ops button{opacity:0;transition:opacity .12s;padding:3px 5px;color:var(--ink2);border-radius:4px}
.row-ops button:hover{background:var(--accent-soft);color:var(--accent)}
tbody tr:hover .row-ops button{opacity:1}
.row-ops button.del:hover{background:var(--danger-soft);color:var(--danger)}
.row-ops svg{width:15px;height:15px}
.empty-row td{text-align:center;color:var(--ink3);padding:36px 0;font-size:13px}

/* ===== 列设置浮层 ===== */
.popover{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 6px 24px rgba(28,42,58,.18);z-index:40;padding:10px 12px;min-width:220px;max-width:320px;max-height:70vh;overflow:auto}
.popover h4{font-size:12px;color:var(--ink2);margin-bottom:8px;font-weight:600}
.col-list{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px}
.col-list label{display:flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap;padding:2px 0;cursor:pointer}
.col-list input{accent-color:var(--accent);cursor:pointer}
.pop-actions{display:flex;gap:6px;margin-top:8px}

/* ===== 弹窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(20,30,42,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.overlay.show{display:flex}
.modal{background:var(--panel);border-radius:10px;width:min(860px,96vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(20,30,42,.3)}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-head h3{font-size:15px;font-weight:700}
.modal-head .sub{font-size:12px;color:var(--ink2)}
.modal-head .x{margin-left:auto;color:var(--ink2);font-size:20px;line-height:1;padding:2px 6px;border-radius:4px}
.modal-head .x:hover{background:var(--line2);color:var(--ink)}
.modal-body{overflow:auto;padding:16px 18px}
.modal-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.edit-field{display:flex;flex-direction:column;gap:4px}
.edit-field.full{grid-column:1/-1}
.edit-field label{font-size:12px;color:var(--ink2);font-weight:600}
.edit-field input,.edit-field textarea{
  padding:6px 8px;border:1px solid var(--line);border-radius:5px;outline:none;background:#fbfcfe;width:100%;
}
.edit-field input:focus,.edit-field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,109,164,.14);background:#fff}
.edit-field textarea{resize:vertical;min-height:56px;font-size:13px}
.rowid{color:var(--ink3);font-size:12px;padding-left:4px;font-weight:400}

/* ===== 统计页 ===== */
.stats-wrap{flex:1;overflow:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-content:start}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.stat-card h3{font-size:13.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.stat-card h3 .tag{font-size:11px;color:var(--ink3);font-weight:500}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kpi{flex:1;min-width:86px;background:var(--zebra);border:1px solid var(--line2);border-radius:6px;padding:8px 10px}
.kpi b{display:block;font-size:19px;color:var(--accent-d);font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--ink2)}
.bar-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:5px 0}
.bar-row .lbl{flex:0 0 96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.bar-row .track{flex:1;background:var(--line2);border-radius:3px;height:14px;overflow:hidden}
.bar-row .fill{height:100%;background:linear-gradient(90deg,var(--accent),#6fa4cf);border-radius:3px;min-width:2px}
.bar-row .val{flex:0 0 64px;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.stats-note{font-size:11.5px;color:var(--ink3);margin-top:10px;line-height:1.6}
.empty-desc{color:var(--ink3);font-size:12.5px;padding:6px 0}

/* ===== 提示条 ===== */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:#1c2a3a;color:#eaf1f7;padding:9px 18px;border-radius:8px;font-size:13px;
  box-shadow:0 6px 20px rgba(20,30,42,.35);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:200;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.warn{background:var(--warn)}
.toast.ok{background:var(--ok)}

/* ===== 帮助 ===== */
.help-body{font-size:13px;line-height:1.8;color:var(--ink)}
.help-body h4{font-size:13px;color:var(--accent-d);margin:12px 0 4px}
.help-body ul{padding-left:20px}
.help-body li{margin:2px 0}
.help-body code{background:var(--line2);padding:1px 6px;border-radius:4px;font-size:12px}
.help-foot{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink3)}

@media (max-width:760px){
  .topbar{padding:0 10px;gap:8px}
  .brand .sub{display:none}
  .btn span.tx{display:none}
  .tabs{padding:0 6px}
  .tab{padding:10px 11px;font-size:13px}
  .edit-grid{grid-template-columns:1fr}
  .stats-wrap{grid-template-columns:1fr;padding:12px}
  .filter-add select{max-width:120px}
  input,select,textarea{font-size:16px}
  .edit-field textarea{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
<style>
.sync-area{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#b9c9d8;white-space:nowrap;max-width:40vw;overflow:hidden}
.sync-area .sync-btn{background:transparent;border:1px solid #38506a;color:#cddbe8;border-radius:6px;font-size:12px;padding:3px 8px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.sync-area .sync-btn:hover{border-color:var(--accent);color:#fff}
.sync-area .sync-btn.hot{border-color:#e8a33d;color:#ffd88a;animation:syncPulse 1.8s ease-in-out infinite}
@keyframes syncPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,163,61,.0)}50%{box-shadow:0 0 0 3px rgba(232,163,61,.28)}}
.sync-area .st-ok{color:#8fd6a8}
.sync-area .st-pending{color:#e8c88a}
.sync-area .st-fail{color:#f2a3a3}
.sync-area .st-idle{color:#b9c9d8}
.sync-dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
.sync-modal .modal{width:min(480px,94vw)}
.sync-modal .edit-field{margin-bottom:10px}
.sync-modal .edit-field input{width:100%;box-sizing:border-box}
.sync-modal .hint{font-size:12px;color:var(--ink3);line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.sync-modal .modal-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.sync-modal .modal-foot .spacer{flex:1}
@media (max-width:760px){.sync-area{max-width:34vw}.sync-area .sync-btn .tx2{display:none}}
</style></head>
<body>
<!-- ===== 顶栏 ===== -->
<header class="topbar">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 34 34" aria-hidden="true">
      <circle cx="17" cy="17" r="14" fill="#2e6da4"/>
      <circle cx="17" cy="17" r="8.5" fill="#1c2a3a" stroke="#eaf1f7" stroke-width="1.2"/>
      <path d="M3 17h4.5M26.5 17H31M17 3v4.5M17 26.5V31" stroke="#eaf1f7" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M8.2 8.2l2.6 2.6M23.2 23.2l2.6 2.6M25.8 8.2l-2.6 2.6M10.8 23.2l-2.6 2.6" stroke="#9db3c7" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>半钢模具管理台账</h1>
      <div class="sub">查询 · 编辑 · 导出一体化工具</div>
    </div>
  </div>
  <div class="top-actions">
    <span class="sync-area" id="syncArea"></span>
    <span class="save-state ok" id="saveState"><span class="dot"></span><span id="saveStateTxt">就绪</span></span>
    <button class="btn" id="btnImport" title="从 Excel 文件导入数据（覆盖当前数据）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0l-4 4m4-4l4 4"/><path d="M4 15v4a1 1 0 001 1h14a1 1 0 001-1v-4"/></svg>
      <span class="tx">导入 Excel</span>
    </button>
    <button class="btn primary" id="btnExport" title="导出为 Excel（可选择覆盖原文件）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0l-4-4m4 4l4-4"/><path d="M4 15v4a1 1 0 001 1h14a1 1 0 001-1v-4"/></svg>
      <span class="tx">导出 Excel</span>
    </button>
    <button class="btn" id="btnReset" title="恢复为最初导入的原始数据">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      <span class="tx">重置</span>
    </button>
    <button class="btn" id="btnHelp" title="使用说明">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.2 9a2.9 2.9 0 015.7.9c0 1.9-2.6 2.3-2.6 3.8"/><circle cx="12" cy="17" r=".8" fill="currentColor"/></svg>
      <span class="tx">帮助</span>
    </button>
  </div>
</header>

<main class="main">
  <!-- 标签页 -->
  <nav class="tabs" id="tabs"></nav>

  <!-- 工具栏（按标签页动态渲染） -->
  <div class="toolbar" id="toolbar"></div>
  <div class="result-meta" id="meta"></div>

  <!-- 表格区 -->
  <div class="tbl-wrap" id="tblWrap"></div>

  <!-- 统计区 -->
  <div class="stats-wrap" id="statsWrap" style="display:none"></div>
</main>

<!-- 隐藏文件输入 -->
<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none">

<!-- ===== 行编辑弹窗 ===== -->
<div class="overlay" id="rowModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="rowModalTitle">编辑记录</h3>
      <span class="sub" id="rowModalSub"></span>
      <button class="x" id="rowModalClose" title="关闭">×</button>
    </div>
    <div class="modal-body">
      <div class="edit-grid" id="rowModalFields"></div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="rowModalCancel">取消</button>
      <button class="btn primary" id="rowModalSave">保存修改</button>
    </div>
  </div>
</div>

<!-- ===== 列设置浮层 ===== -->
<div class="popover" id="colPop" style="display:none">
  <h4>显示列</h4>
  <div class="col-list" id="colList"></div>
  <div class="pop-actions">
    <button class="btn small ghost" id="colAll">全选</button>
    <button class="btn small ghost" id="colNone">全不选</button>
    <button class="btn small ghost" id="colReset">恢复默认</button>
  </div>
</div>

<!-- ===== 帮助弹窗 ===== -->
<div class="overlay" id="helpModal">
  <div class="modal" style="width:min(620px,96vw)">
    <div class="modal-head">
      <h3>使用说明</h3>
      <button class="x" id="helpClose">×</button>
    </div>
    <div class="modal-body help-body" id="helpBody"></div>
  </div>
</div>

<!-- ===== 确认弹窗 ===== -->
<div class="overlay" id="confirmModal">
  <div class="modal" style="width:min(420px,94vw)">
    <div class="modal-head"><h3 id="confirmTitle">确认操作</h3></div>
    <div class="modal-body" id="confirmText" style="font-size:13.5px;color:var(--ink);line-height:1.7"></div>
    <div class="modal-foot">
      <button class="btn" id="confirmCancel">取消</button>
      <button class="btn danger" id="confirmOk">确认</button>
    </div>
  </div>

  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 114 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
  del: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>',
  cols: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  del2: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>'
};

/* ================= 列宽 ================= */
const WRAP_KEYWORDS = ['商标','花编','备注','结构','气压','报废原因','负荷','信息','活字块','花纹圈','溢胶槽','搭配','存放'];
function colWidth(sheet, idx, header){
  const h = header || '';
  if(WRAP_KEYWORDS.some(k => h.includes(k))) return 190;
  if(h.includes('模号')) return 140;
  if(h.includes('规格')) return 106;
  if(h.includes('日期')) return 100;
  if(h.includes('厂家')) return 100;
  if(h.includes('柜号')) return 130;
  if(h.includes('客户')) return 92;
  if(h.includes('序号') || h === '数量' || h === '数量2') return 62;
  if(h === '分区' || h === '层') return 54;
  if(h === '3C' || h === 'E4' || h === 'M+S' || h === 'DOT' || h.includes('雪地')) return 74;
  return 100;
}
function isNumCol(sheet, idx){ const h = sheet.headers[idx] || ''; return h === '序号' || h === '数量' || h === '数量2'; }
function isWrapCol(sheet, idx){ const h = sheet.headers[idx] || ''; return WRAP_KEYWORDS.some(k => h.includes(k)); }

/* ================= 渲染：标签页 ================= */
function renderTabs(){
  const tabs = document.getElementById('tabs');
  let html = '';
  DB.sheets.forEach(s => {
    const active = ui.tab === s.id ? ' active' : '';
    html += `<button class="tab${active}" data-tab="${s.id}">${s.name}<span class="cnt">${s.rows.length}</span></button>`;
  });
  const active = ui.tab === 'stats' ? ' active' : '';
  html += `<button class="tab${active}" data-tab="stats">数据统计</button>`;
  tabs.innerHTML = html;
}

/* ================= 渲染：工具栏 ================= */
function renderToolbar(){
  const tb = document.getElementById('toolbar');
  const s = sheetById(ui.tab);
  if(!s){ tb.innerHTML = ''; return; }
  const hidden = ui.hidden[s.id];
  const visCols = s.headers.map((_, i) => i).filter(i => !hidden.has(i));
  const filterCol = document.getElementById('_fcol') ? document.getElementById('_fcol').value : '0';
  const filterVal = document.getElementById('_fval') ? document.getElementById('_fval').value : '';

  let html = `
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="qInput" placeholder="搜索任意字段，如模号 CYD-TJ23042 / 花纹 GF118 / 厂家…" value="${escAttr(ui.q[s.id] || '')}">
    </div>
    <div class="filter-add">
      <select id="_fcol">${s.headers.map((h, i) => `<option value="${i}" ${Number(filterCol) === i ? 'selected' : ''}>${escAttr(h)}</option>`).join('')}</select>
      <select id="_fval"><option value="">= 值…</option>${uniqueValues(s, Number(filterCol)).map(v => `<option ${v === filterVal ? 'selected' : ''}>${escAttr(v)}</option>`).join('')}</select>
      <button class="btn small ghost" id="btnAddFilter">+ 筛选</button>
    </div>
    <div class="tool-spacer"></div>
    ${s.editable ? `
      <button class="btn ghost small" id="btnAddRow" title="新增一行">${ICONS.plus} 新增行</button>
      <button class="btn danger small" id="btnDelSel" title="删除选中的行" style="display:none">${ICONS.del2} 删除选中</button>
    ` : ''}
    <button class="btn ghost small" id="btnCols" title="选择显示哪些列">${ICONS.cols} 列设置${hidden.size ? ` (${hidden.size})` : ''}</button>
  `;
  tb.innerHTML = html;

  const chips = document.createElement('div');
  chips.className = 'chips';
  (ui.filters[s.id] || []).forEach((f, i) => {
    chips.innerHTML += `<span class="chip">${escAttr(s.headers[f.col])} = ${escAttr(f.val)}<button data-fidx="${i}" title="移除该筛选">×</button></span>`;
  });
  if((ui.filters[s.id] || []).length) chips.innerHTML += `<span class="chip plain">共 ${(ui.filters[s.id] || []).length} 个筛选</span>`;
  tb.appendChild(chips);

  if(!s.editable){
    const note = document.createElement('div');
    note.style.cssText = 'font-size:11.5px;color:var(--ink3);margin-left:auto';
    note.textContent = '此页为存放位置速查表（只读），原始布局请在 Excel 中维护';
    chips.appendChild(note);
  }

  const qInput = document.getElementById('qInput');
  let qTimer = null;
  qInput.addEventListener('input', () => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => {
      ui.q[s.id] = qInput.value;
      ui.page[s.id] = 1;
      clearSel(s.id);
      renderTable(); renderMeta();
    }, 180);
  });
  document.getElementById('_fval').addEventListener('change', e => {
    if(e.target.value) document.getElementById('btnAddFilter').click();
  });
  document.getElementById('btnAddFilter').addEventListener('click', () => {
    const col = Number(document.getElementById('_fcol').value);
    const val = document.getElementById('_fval').value;
    if(!val){ toast('请先选择筛选值'); return; }
    const flt = ui.filters[s.id] || [];
    if(flt.some(f => f.col === col && f.val === val)){ toast('该筛选已存在'); return; }
    flt.push({ col, val });
    ui.page[s.id] = 1;
    renderToolbar(); renderTable(); renderMeta();
  });
  tb.querySelectorAll('[data-fidx]').forEach(b => b.addEventListener('click', () => {
    ui.filters[s.id].splice(Number(b.dataset.fidx), 1);
    ui.page[s.id] = 1;
    renderToolbar(); renderTable(); renderMeta();
  }));
  const addBtn = document.getElementById('btnAddRow');
  if(addBtn) addBtn.addEventListener('click', () => addRow(s.id));
  const delBtn = document.getElementById('btnDelSel');
  if(delBtn) delBtn.addEventListener('click', () => deleteSelected(s.id));
  document.getElementById('btnCols').addEventListener('click', e => toggleColPop(e, s));
}

function uniqueValues(sheet, col){
  const seen = new Set();
  const freq = new Map();
  sheet.rows.forEach(r => {
    const v = norm(r[col]);
    if(v){ freq.set(v, (freq.get(v) || 0) + 1); seen.add(v); }
  });
  return Array.from(seen).sort((a, b) => (freq.get(b) - freq.get(a)) || a.localeCompare(b, 'zh'));
}

function escAttr(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ================= 渲染：元信息与分页 ================= */
function renderMeta(){
  const s = sheetById(ui.tab);
  if(!s){ document.getElementById('meta').innerHTML = ''; return; }
  const all = filteredRows(s);
  const total = s.rows.length;
  const size = PAGE_SIZES[s.id] || 50;
  const pages = Math.max(1, Math.ceil(all.length / size));
  if(ui.page[s.id] > pages) ui.page[s.id] = pages;
  const p = ui.page[s.id];
  const selN = (ui.sel[s.id] || new Set()).size;
  const hiddenN = ui.hidden[s.id].size;
  let html = `<span>共 <b>${total}</b> 条记录</span>`;
  if(all.length !== total) html += `<span>筛选出 <b>${all.length}</b> 条</span>`;
  if(hiddenN) html += `<span style="color:var(--ink3)">已隐藏 ${hiddenN} 列</span>`;
  if(selN) html += `<span style="color:var(--accent)">已选 ${selN} 条</span>`;
  html += `<div class="pager">
      <button id="pgPrev" ${p <= 1 ? 'disabled' : ''}>‹</button>
      <span class="pg-num">第 ${p} / ${pages} 页</span>
      <button id="pgNext" ${p >= pages ? 'disabled' : ''}>›</button>
    </div>`;
  document.getElementById('meta').innerHTML = html;
  document.getElementById('pgPrev').onclick = () => { if(ui.page[s.id] > 1){ ui.page[s.id]--; renderTable(); renderMeta(); } };
  document.getElementById('pgNext').onclick = () => { if(ui.page[s.id] < pages){ ui.page[s.id]++; renderTable(); renderMeta(); } };
}

/* ================= 渲染：表格 ================= */
function clearSel(id){ ui.sel[id] = new Set(); document.getElementById('btnDelSel') && (document.getElementById('btnDelSel').style.display = 'none'); }

function renderTable(){
  const s = sheetById(ui.tab);
  const wrap = document.getElementById('tblWrap');
  if(!s){ wrap.innerHTML = ''; return; }
  const hidden = ui.hidden[s.id];
  const cols = s.headers.map((_, i) => i).filter(i => !hidden.has(i));
  const all = filteredRows(s);
  const size = PAGE_SIZES[s.id] || 50;
  const pages = Math.max(1, Math.ceil(all.length / size));
  const p = Math.min(ui.page[s.id], pages);
  const pageRows = all.slice((p - 1) * size, p * size);
  const sort = ui.sort[s.id];
  const sel = ui.sel[s.id];

  const colgroup = cols.map(i => `<col style="width:${colWidth(s, i, s.headers[i])}px">`).join('');
  let thead = `<tr>`;
  if(s.editable){
    thead += `<th class="cbx"><input type="checkbox" id="chkAll" ${pageRows.length && pageRows.every(x => sel.has(x.i)) ? 'checked' : ''}></th>`;
  }
  cols.forEach(i => {
    const h = s.headers[i];
    const cls = s.editable ? 'sortable' : 'sortable';
    let arr = '';
    if(sort && sort.col === i) arr = sort.dir === 1 ? '<span class="arr">▲</span>' : '<span class="arr">▼</span>';
    thead += `<th class="${cls}" data-col="${i}">${escHtml(h)}${arr}</th>`;
  });
  if(s.editable) thead += `<th class="row-ops"></th>`;
  thead += `</tr>`;

  let body = '';
  if(!pageRows.length){
    body = `<tr class="empty-row"><td colspan="${cols.length + (s.editable ? 2 : 0)}">没有匹配的记录，试试调整搜索或筛选条件</td></tr>`;
  } else {
    pageRows.forEach(x => {
      const selCls = sel.has(x.i) ? ' sel' : '';
      body += `<tr class="${selCls}" data-gidx="${x.i}">`;
      if(s.editable){
        body += `<td class="cbx"><input type="checkbox" class="rowchk" data-gidx="${x.i}" ${sel.has(x.i) ? 'checked' : ''}></td>`;
      }
      cols.forEach(ci => {
        const v = x.r[ci];
        const empty = (v === '' || v === null || v === undefined);
        const numCls = isNumCol(s, ci) && !empty ? ' num' : '';
        const wrapCls = (isWrapCol(s, ci) || (typeof v === 'string' && v.includes('\n'))) ? ' wrap' : '';
        body += `<td class="cell${empty ? ' empty' : ''}${numCls}${wrapCls}" data-col="${ci}">${empty ? '' : escHtml(v)}</td>`;
      });
      if(s.editable){
        body += `<td class="row-ops">
          <button class="op-edit" data-gidx="${x.i}" title="编辑整行">${ICONS.edit}</button>
          <button class="op-del" data-gidx="${x.i}" title="删除该行">${ICONS.del}</button>
        </td>`;
      }
      body += `</tr>`;
    });
  }

  wrap.innerHTML = `<table><colgroup>${colgroup}</colgroup><thead>${thead}</thead><tbody>${body}</tbody></table>`;

  /* 事件 */
  const chkAll = document.getElementById('chkAll');
  if(chkAll) chkAll.onclick = e => {
    if(e.target.checked) pageRows.forEach(x => sel.add(x.i));
    else pageRows.forEach(x => sel.delete(x.i));
    const btn = document.getElementById('btnDelSel');
    if(btn) btn.style.display = sel.size ? '' : 'none';
    renderTable();
  };
  wrap.querySelectorAll('.rowchk').forEach(c => c.onchange = () => {
    const g = Number(c.dataset.gidx);
    if(c.checked) sel.add(g); else sel.delete(g);
    const btn = document.getElementById('btnDelSel');
    if(btn) btn.style.display = sel.size ? '' : 'none';
    c.closest('tr').classList.toggle('sel', c.checked);
  });
  wrap.querySelectorAll('th.sortable').forEach(th => th.onclick = () => {
    const col = Number(th.dataset.col);
    const cur = ui.sort[s.id];
    if(!cur || cur.col !== col) ui.sort[s.id] = { col, dir: 1 };
    else if(cur.dir === 1) ui.sort[s.id] = { col, dir: -1 };
    else ui.sort[s.id] = null;
    renderTable(); renderMeta();
  });
  wrap.querySelectorAll('td.cell').forEach(td => td.ondblclick = () => {
    const tr = td.closest('tr');
    if(!tr || !s.editable) return;
    const g = Number(tr.dataset.gidx);
    const col = Number(td.dataset.col);
    startInlineEdit(s.id, g, col, td);
  });
  wrap.querySelectorAll('.op-edit').forEach(b => b.onclick = () => openRowModal(s.id, Number(b.dataset.gidx)));
  wrap.querySelectorAll('.op-del').forEach(b => b.onclick = () => deleteRow(s.id, Number(b.dataset.gidx)));
}
</script>
<script>
'use strict';
/* ================= 编辑 ================= */
function toCellVal(s, col, str){
  const h = s.headers[col] || '';
  if((h === '序号' || h === '数量' || h === '数量2' || h === '生产编号') && /^\d+$/.test(str)) return Number(str);
  return str;
}

function startInlineEdit(sid, gidx, col, td){
  const s = sheetById(sid);
  if(!s || !s.editable) return;
  const row = s.rows[gidx];
  if(!row) return;
  const cur = norm(row[col]);
  const multi = isWrapCol(s, col) || cur.includes('\n') || cur.length > 60;
  const el = multi ? document.createElement('textarea') : document.createElement('input');
  el.value = cur;
  el.style.cssText = 'width:100%;min-width:130px;border:1px solid var(--accent);border-radius:4px;padding:3px 6px;outline:none;background:#fff;font-size:13px';
  if(multi){ el.style.minHeight = '70px'; el.style.whiteSpace = 'pre-wrap'; }
  td.textContent = '';
  td.appendChild(el);
  el.focus();
  if(el.select) el.select();
  let done = false;
  const commit = () => {
    if(done) return; done = true;
    const v = el.value;
    if(v !== cur){
      row[col] = toCellVal(s, col, v);
      markDirty(); saveDB();
    }
    renderTable(); renderMeta();
  };
  el.addEventListener('keydown', e => {
    if(e.key === 'Enter' && !multi){ e.preventDefault(); el.blur(); }
    else if(e.key === 'Enter' && multi && e.ctrlKey){ e.preventDefault(); el.blur(); }
    else if(e.key === 'Escape'){ done = true; renderTable(); }
  });
  el.addEventListener('blur', commit);
}

/* ---- 整行编辑弹窗 ---- */
let rowModalState = null;
function openRowModal(sid, gidx){
  const s = sheetById(sid);
  const row = s.rows[gidx];
  if(!s || !row) return;
  rowModalState = { sid, gidx };
  document.getElementById('rowModalTitle').textContent = '编辑记录';
  document.getElementById('rowModalSub').textContent = `${s.name} · 第 ${gidx + 1} 条`;
  const fields = s.headers.map((h, i) => {
    const cur = norm(row[i]);
    const full = isWrapCol(s, i) || cur.length > 40 || cur.includes('\n');
    return `<div class="edit-field${full ? ' full' : ''}">
      <label>${escHtml(h)}</label>
      <textarea data-i="${i}" rows="${full ? 3 : 1}">${escHtml(cur)}</textarea>
    </div>`;
  }).join('');
  document.getElementById('rowModalFields').innerHTML = fields;
  document.getElementById('rowModal').classList.add('show');
}
function rowModalSave(){
  if(!rowModalState) return;
  const { sid, gidx } = rowModalState;
  const s = sheetById(sid);
  const row = s.rows[gidx];
  let changed = false;
  document.querySelectorAll('#rowModalFields textarea').forEach(ta => {
    const i = Number(ta.dataset.i);
    const v = toCellVal(s, i, ta.value);
    if(norm(row[i]) !== norm(v)){ row[i] = v; changed = true; }
  });
  if(changed){ markDirty(); saveDB(); }
  closeRowModal();
  renderTable(); renderMeta();
}
function closeRowModal(){
  rowModalState = null;
  document.getElementById('rowModal').classList.remove('show');
}

/* ---- 新增 / 删除 ---- */
function addRow(sid){
  const s = sheetById(sid);
  const newRow = s.headers.map(() => '');
  if(s.headers[0] === '序号'){
    let mx = 0;
    s.rows.forEach(r => { const v = Number(r[0]); if(!isNaN(v) && v > mx) mx = v; });
    newRow[0] = mx + 1;
  }
  s.rows.push(newRow);
  ui.page[sid] = Math.max(1, Math.ceil(s.rows.length / (PAGE_SIZES[sid] || 50)));
  markDirty(); saveDB(); renderAll();
  toast('已新增一行，双击单元格即可填写');
}
function deleteRow(sid, gidx){
  const s = sheetById(sid);
  const row = s.rows[gidx];
  const desc = row.slice(0, 6).map(norm).filter(Boolean).join(' · ') || `第 ${gidx + 1} 条`;
  confirmDialog('删除该行', `确定删除这一条记录吗？<br><b style="color:var(--danger)">${escHtml(desc)}</b><br>删除后可通过「重置」恢复最初数据，但其他修改会保留。`).then(ok => {
    if(!ok) return;
    s.rows.splice(gidx, 1);
    (ui.sel[sid] || new Set()).delete(gidx);
    markDirty(); saveDB(); renderAll();
    toast('已删除', 'ok');
  });
}
function deleteSelected(sid){
  const sel = ui.sel[sid] || new Set();
  if(!sel.size){ toast('请先勾选要删除的行'); return; }
  const idxs = Array.from(sel).sort((a, b) => b - a);
  confirmDialog('删除选中行', `确定删除选中的 <b style="color:var(--danger)">${idxs.length}</b> 条记录吗？删除后可通过「重置」恢复最初数据。`).then(ok => {
    if(!ok) return;
    const s = sheetById(sid);
    idxs.forEach(i => s.rows.splice(i, 1));
    ui.sel[sid] = new Set();
    markDirty(); saveDB(); renderAll();
    toast(`已删除 ${idxs.length} 条`, 'ok');
  });
}

/* ================= 列设置 ================= */
function toggleColPop(ev, sheet){
  const pop = document.getElementById('colPop');
  if(pop.style.display !== 'none' && pop._sid === sheet.id){ pop.style.display = 'none'; return; }
  pop._sid = sheet.id;
  pop.innerHTML = `<h4>显示列（${sheet.headers.length} 列）</h4>
    <div class="col-list">${sheet.headers.map((h, i) => {
      const on = !ui.hidden[sheet.id].has(i);
      return `<label><input type="checkbox" data-i="${i}" ${on ? 'checked' : ''}>${escHtml(h)}</label>`;
    }).join('')}</div>
    <div class="pop-actions">
      <button class="btn small ghost" id="colAll">全选</button>
      <button class="btn small ghost" id="colNone">全不选</button>
      <button class="btn small ghost" id="colReset">恢复默认</button>
    </div>`;
  pop.style.display = 'block';
  const r = ev.currentTarget.getBoundingClientRect();
  const pw = pop.offsetWidth;
  let left = Math.min(r.left, window.innerWidth - pw - 10);
  if(left < 10) left = 10;
  pop.style.position = 'fixed';
  pop.style.left = left + 'px';
  pop.style.top = Math.min(r.bottom + 6, window.innerHeight - pop.offsetHeight - 10) + 'px';
  pop.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => {
    const i = Number(cb.dataset.i);
    if(cb.checked) ui.hidden[sheet.id].delete(i);
    else ui.hidden[sheet.id].add(i);
    renderTable(); renderMeta(); refreshColBtn();
  });
  pop.querySelector('#colAll').onclick = () => { ui.hidden[sheet.id].clear(); renderTable(); renderMeta(); refreshColBtn(); rebuildColChecks(sheet); };
  pop.querySelector('#colNone').onclick = () => { ui.hidden[sheet.id] = new Set(sheet.headers.map((_, i) => i)); renderTable(); renderMeta(); refreshColBtn(); rebuildColChecks(sheet); };
  pop.querySelector('#colReset').onclick = () => { ui.hidden[sheet.id] = new Set(); renderTable(); renderMeta(); refreshColBtn(); rebuildColChecks(sheet); };
}
function rebuildColChecks(sheet){
  const pop = document.getElementById('colPop');
  pop.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.checked = !ui.hidden[sheet.id].has(Number(cb.dataset.i));
  });
}
function refreshColBtn(){
  const btn = document.getElementById('btnCols');
  if(!btn) return;
  const s = sheetById(ui.tab);
  const n = ui.hidden[s.id].size;
  btn.innerHTML = `${ICONS.cols} 列设置${n ? ` (${n})` : ''}`;
}

/* ================= 导入 / 导出 ================= */
const XLSX_URLS = [
  'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'
];
let xlsxLoading = false;
function loadXLSX(cb){
  if(window.XLSX) return cb();
  if(xlsxLoading){ setTimeout(() => loadXLSX(cb), 200); return; }
  xlsxLoading = true;
  let i = 0;
  const tryNext = () => {
    if(i >= XLSX_URLS.length){ xlsxLoading = false; toast('表格引擎加载失败，请检查网络连接', 'warn'); return; }
    const sEl = document.createElement('script');
    sEl.src = XLSX_URLS[i++];
    sEl.onload = () => { xlsxLoading = false; cb(); };
    sEl.onerror = tryNext;
    document.head.appendChild(sEl);
  };
  tryNext();
}

function exportExcel(){
  loadXLSX(() => {
    try{
      const wb = XLSX.utils.book_new();
      DB.sheets.forEach(s => {
        const aoa = [s.headers.slice(), ...s.rows.map(r => r.slice())];
        const ws = XLSX.utils.aoa_to_sheet(aoa);
        ws['!cols'] = s.headers.map(h => ({ wch: Math.max(10, Math.min(36, (String(h).length + 2) * 2)) }));
        XLSX.utils.book_append_sheet(wb, ws, s.name);
      });
      const fname = '全钢模具管理台账.xlsx';
      if(window.showSaveFilePicker){
        window.showSaveFilePicker({
          suggestedName: fname,
          types: [{ description: 'Excel 工作簿', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }]
        }).then(async handle => {
          const w = await handle.createWritable();
          await w.write(XLSX.write(wb, { bookType: 'xlsx', type: 'array' }));
          await w.close();
          toast('已保存到所选位置', 'ok');
        }).catch(err => {
          if(err && (err.name === 'AbortError' || err.name === 'SecurityError')) { XLSX.writeFile(wb, fname); toast('已导出 ' + fname, 'ok'); return; }
          XLSX.writeFile(wb, fname); toast('已导出 ' + fname, 'ok');
        });
      } else {
        XLSX.writeFile(wb, fname);
        toast('已导出 ' + fname, 'ok');
      }
    }catch(err){ toast('导出失败：' + err.message, 'warn'); }
  });
}

function importExcel(file){
  loadXLSX(() => {
    const rd = new FileReader();
    rd.onload = e => {
      try{
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
        const names = wb.SheetNames;
        const skipped = [];
        confirmDialog('导入 Excel', `将用「<b>${escHtml(file.name)}</b>」中的数据覆盖当前全部记录。当前所有修改将丢失，是否继续？`).then(ok => {
          if(!ok) return;
          DB.sheets.forEach(s => {
            const idx = names.indexOf(s.name);
            if(idx < 0){ skipped.push(s.name); return; }
            const ws = wb.Sheets[names[idx]];
            let aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true });
            if(!aoa.length){ skipped.push(s.name); return; }
            const hdrRow = aoa[0].map(v => (v === null || v === undefined) ? '' : String(v).replace(/\s+/g, '').trim());
            if(s.id === 'storage'){
              const colMap = {};
              ['柜号', '分区', '层', '规格', '花纹'].forEach((k, ci) => {
                const hi = hdrRow.findIndex(h => h === k);
                colMap[ci] = hi;
              });
              if(colMap[0] < 0){ skipped.push(s.name); return; }
              s.rows = aoa.slice(1).map(row => [0,1,2,3,4].map(ci => (row[colMap[ci]] === null || row[colMap[ci]] === undefined) ? '' : row[colMap[ci]]));
            } else {
              const ncols = s.headers.length;
              const data = aoa.slice(1).map(row => {
                const out = [];
                for(let c = 0; c < ncols; c++) out.push((row[c] === null || row[c] === undefined) ? '' : row[c]);
                return out;
              });
              // 合并单元格纵向填充（还原原表分组）
              (ws['!merges'] || []).forEach(m => {
                if(m.e.r > m.s.r && m.e.c === m.s.c){
                  const v = data[m.s.r - 1] ? data[m.s.r - 1][m.s.c] : '';
                  for(let r = m.s.r; r <= m.e.r; r++){ if(data[r - 1]) data[r - 1][m.s.c] = v; }
                }
              });
              s.rows = data;
            }
            normalizeRows(s);
          });
          DB.sheets.forEach(s => { s.editable = true; });
          ui.page = { main: 1, moke: 1, cust: 1, storage: 1 };
          ui.sel = {}; ui.hidden = {}; ui.sort = {};
          DB.sheets.forEach(s => { ui.hidden[s.id] = new Set(); ui.sel[s.id] = new Set(); ui.sort[s.id] = null; ui.q[s.id] = ''; });
          markDirty(); saveDB(); renderAll();
          toast(skipped.length ? `导入完成（跳过：${skipped.join('、')}）` : '导入完成', 'ok');
        });
      }catch(err){ toast('文件解析失败：' + err.message, 'warn'); }
    };
    rd.readAsArrayBuffer(file);
  });
}

/* ================= 统计 ================= */
function uniqCount(sheet, col){
  const set = new Set();
  sheet.rows.forEach(r => { const v = norm(r[col]).trim(); if(v) set.add(v); });
  return set.size;
}
function freqOf(sheet, col, top){
  const freq = new Map();
  sheet.rows.forEach(r => {
    const v = norm(r[col]).trim();
    if(!v) return;
    freq.set(v, (freq.get(v) || 0) + 1);
  });
  return Array.from(freq.entries()).sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0], 'zh')).slice(0, top);
}
function yearOf(v){
  const s = norm(v);
  let m = s.match(/(19|20)\d{2}/);
  if(m) return m[0];
  m = s.match(/^(\d{2})[.\-/年]/);
  if(m){ const y = 2000 + Number(m[1]); if(y >= 2020 && y <= 2099) return String(y); }
  return null;
}
function kpi(label, val){
  return `<div class="kpi"><b>${val}</b><span>${label}</span></div>`;
}
function bars(list, emptyText){
  if(!list || !list.length) return `<div class="empty-desc">${emptyText || '暂无数据'}</div>`;
  const max = list[0][1];
  return list.map(([k, v]) => `
    <div class="bar-row">
      <span class="lbl" title="${escAttr(k)}">${escHtml(k)}</span>
      <span class="track"><span class="fill" style="width:${Math.max(2, Math.round(v / max * 100))}%"></span></span>
      <span class="val">${v}</span>
    </div>`).join('');
}
function statCard(title, kpisHtml, sections){
  return `<div class="stat-card">
    <h3>${escHtml(title)}<span class="tag">当前数据实时统计</span></h3>
    <div class="kpis">${kpisHtml}</div>
    ${sections.map(sec => `<div style="margin-top:10px"><h3 style="font-size:12.5px;margin-bottom:6px">${escHtml(sec.title)}</h3>${bars(sec.data, sec.empty)}</div>`).join('')}
  </div>`;
}
function findCol(sheet){
  var keys = Array.prototype.slice.call(arguments, 1);
  for(var i = 0; i < sheet.headers.length; i++){
    var h = sheet.headers[i] || '';
    for(var k = 0; k < keys.length; k++){ if(h.indexOf(keys[k]) >= 0) return i; }
  }
  return -1;
}
function renderStats(){
  var wrap = document.getElementById('statsWrap');
  var html = '';
  DB.sheets.forEach(function(s){
    var kpis = [kpi('总记录', s.rows.length)];
    var sections = [];
    var cMod = findCol(s, '模号'); if(cMod >= 0) kpis.push(kpi('模号数', uniqCount(s, cMod)));
    var cSpec = findCol(s, '规格'); if(cSpec >= 0) kpis.push(kpi('规格数', uniqCount(s, cSpec)));
    var cPat = findCol(s, '花纹'); if(cPat >= 0) kpis.push(kpi('花纹数', uniqCount(s, cPat)));
    var cHold = findCol(s, '存放'); if(cHold >= 0) kpis.push(kpi('存放位置', uniqCount(s, cHold)));
    var cFac = findCol(s, '厂家'); if(cFac >= 0) sections.push({title:'生产厂家分布', data:freqOf(s, cFac, 8), empty:'暂无厂家信息'});
    var cDate = findCol(s, '日期'); if(cDate >= 0) sections.push({title:'进厂年份分布', data:freqOfYear(s, cDate), empty:'暂无进厂日期'});
    if(cPat >= 0) sections.push({title:'花纹分布', data:freqOf(s, cPat, 8), empty:'暂无花纹信息'});
    if(cMod >= 0) sections.push({title:'模号分布', data:freqOf(s, cMod, 8), empty:'暂无模号信息'});
    html += statCard(s.name, kpis.join(''), sections);
  });
  html += `<div class="stat-card" style="grid-column:1/-1">
    <h3>说明</h3>
    <div class="stats-note">
      1. 以上统计基于当前数据实时计算，包含尚未导出的修改；<br>
      2. 数据按本机浏览器中当前内容统计，原始 Excel 中合并单元格的重复值已按原表向下填充。
    </div>
  </div>`;
  wrap.innerHTML = html;
}
function freqOfYear(sheet, col){
  const freq = new Map();
  sheet.rows.forEach(r => {
    const y = yearOf(r[col]);
    if(y) freq.set(y, (freq.get(y) || 0) + 1);
  });
  return Array.from(freq.entries()).sort((a, b) => a[0].localeCompare(b[0]));
}

/* ================= 初始化 ================= */
function renderAll(){
  renderTabs();
  if(ui.tab === 'stats'){
    document.getElementById('toolbar').innerHTML = '';
    document.getElementById('meta').innerHTML = '';
    document.getElementById('statsWrap').style.display = 'grid';
    document.getElementById('tblWrap').style.display = 'none';
    renderStats();
  } else {
    document.getElementById('statsWrap').style.display = 'none';
    document.getElementById('tblWrap').style.display = 'block';
    renderToolbar();
    renderMeta();
    renderTable();
  }
}

function init(){
  loadDB();
  saveDB(true);

  document.getElementById('tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab');
    if(!b) return;
    ui.tab = b.dataset.tab;
    renderAll();
  });

  document.getElementById('btnExport').addEventListener('click', exportExcel);
  document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', e => {
    const f = e.target.files[0];
    if(f) importExcel(f);
    e.target.value = '';
  });
  document.getElementById('btnReset').addEventListener('click', () => {
    confirmDialog('重置数据', '将丢弃所有修改，恢复为最初从 Excel 导入的原始数据。确定继续吗？').then(ok => {
      if(!ok) return;
      DB = deepClone(SOURCE_DATA);
      DB.sheets.forEach(normalizeRows);
      ui.page = { main: 1, moke: 1, cust: 1, storage: 1 };
      ui.sel = {}; ui.hidden = {}; ui.sort = {};
      DB.sheets.forEach(s => { ui.hidden[s.id] = new Set(); ui.sel[s.id] = new Set(); ui.sort[s.id] = null; ui.q[s.id] = ''; });
      saveDB(true);
      renderAll();
      toast('已恢复初始数据', 'ok');
    });
  });

  document.getElementById('btnHelp').addEventListener('click', () => {
    document.getElementById('helpBody').innerHTML = HELP_HTML;
    document.getElementById('helpModal').classList.add('show');
  });
  document.getElementById('helpClose').addEventListener('click', () => document.getElementById('helpModal').classList.remove('show'));

  document.getElementById('rowModalSave').addEventListener('click', rowModalSave);
  document.getElementById('rowModalCancel').addEventListener('click', closeRowModal);
  document.getElementById('rowModalClose').addEventListener('click', closeRowModal);

  document.querySelectorAll('.overlay').forEach(ov => {
    ov.addEventListener('mousedown', e => { if(e.target === ov && ov.id !== 'confirmModal') ov.classList.remove('show'); });
  });

  document.addEventListener('click', e => {
    const pop = document.getElementById('colPop');
    if(pop.style.display !== 'none' && !pop.contains(e.target) && e.target.id !== 'btnCols'){
      pop.style.display = 'none';
    }
  });

  // 预加载表格引擎（静默）
  loadXLSX(() => {});

  renderAll();
}
document.addEventListener('DOMContentLoaded', init);
</script>

<script>
(function(){
'use strict';
var GIST = 'ad4ff8ee6b35f7fcc1eb7ffb71e3dbd6';
var USER = 'jcrmghvc78-dev';
var FILE_NAME = 'ledger-data.json';
var RAW = 'https://gist.githubusercontent.com/' + USER + '/' + GIST + '/raw/' + FILE_NAME + '?v=';
var SESSION_CACHE = 'mgmx_mirror_cache_bg_v1';
var mirrorTime = null, mirrorState = 'loading', mirrorTs = null;

function renderMirrorArea(){
  var area = document.getElementById('syncArea');
  if(!area) return;
  var txt, cls;
  if(mirrorState === 'loading'){ txt = '正在加载线上最新数据…'; cls = 'st-pending'; }
  else if(mirrorState === 'ok'){ txt = '线上实时镜像 · 最后更新 ' + (mirrorTime ? mirrorTime.toTimeString().slice(0,5) : ''); cls = 'st-ok'; }
  else { txt = '数据仓连接失败 · 显示内置快照'; cls = 'st-fail'; }
  area.innerHTML = '<span class="' + cls + '" title="本页为只读镜像：请在本地工具中编辑，保存后自动同步到此处"><span class="sync-dot"></span>' + txt + '</span>';
}

function loadSessionCache(){
  try{
    var c = JSON.parse(sessionStorage.getItem(SESSION_CACHE));
    if(!c || !c.data || !c.at) return null;
    if(Date.now() - c.at > 60000) return null; /* 60 秒内复用，减少 API 配额消耗 */
    return c.data;
  }catch(e){ return null; }
}
function saveSessionCache(data){
  try{ sessionStorage.setItem(SESSION_CACHE, JSON.stringify({ at: Date.now(), data: data })); }catch(e){}
}

function applyData(data){
  DB = data;
  DB.sheets.forEach(normalizeRows);
  DB.sheets.forEach(function(s){ s.editable = false; });
  var ts = (data._meta && data._meta.updatedAt) || null;
  if(ts) mirrorTs = ts;
  mirrorTime = new Date(); mirrorState = 'ok';
  ui.page = { main:1, moke:1, cust:1, storage:1 }; ui.sel = {}; ui.hidden = {}; ui.sort = {};
  DB.sheets.forEach(function(s){ ui.hidden[s.id] = new Set(); ui.sel[s.id] = new Set(); ui.sort[s.id] = null; ui.q[s.id] = ''; });
  renderAll();
  renderMirrorArea();
  toast('已加载线上最新数据', 'ok');
}

function refreshFromGist(){
  mirrorState = 'loading'; renderMirrorArea();
  var cached = loadSessionCache();
  if(cached) applyData(cached);
  /* 权威读取：Gist API（不经过 CDN，绝无缓存旧数据）；失败时降级 raw → 内置快照 */
  fetch('https://api.github.com/gists/' + GIST, { headers: { 'Accept': 'application/vnd.github+json' } }).then(function(res){
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }).then(function(g){
    var c = g && g.files && g.files[FILE_NAME] && g.files[FILE_NAME].content;
    if(!c) throw new Error('数据仓文件缺失');
    var data = JSON.parse(c);
    applyData(data);
    saveSessionCache(data);
  }).catch(function(){
    fetch(RAW + Date.now(), { cache: 'no-store' }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function(text){
      var data = JSON.parse(text);
      if(!data || !Array.isArray(data.sheets) || data.sheets.length < 2) throw new Error('数据格式不正确');
      applyData(data);
    }).catch(function(){
      mirrorState = 'fail'; renderMirrorArea();
      toast('无法连接数据仓，当前显示内置快照', 'warn');
    });
  });
}

/* 覆盖 loadDB：镜像页不读取本机浏览器存储，始终以内置快照起步 */
var _origLoadDB = loadDB;
loadDB = function(){
  _origLoadDB();
  DB = deepClone(SOURCE_DATA);
  DB.sheets.forEach(normalizeRows);
  DB.sheets.forEach(function(s){ s.editable = false; });
};

document.addEventListener('DOMContentLoaded', function(){
  /* 镜像页为只读：隐藏导入与新增编辑相关入口 */
  var imp = document.getElementById('btnImport'); if(imp) imp.style.display = 'none';
  /* 内嵌快照自带 Gist 时间戳，作为陈旧检测基准 */
  mirrorTs = (SOURCE_DATA && SOURCE_DATA._meta && SOURCE_DATA._meta.updatedAt) || null;
  renderMirrorArea();
  refreshFromGist();
  var rb = document.getElementById('btnReset');
  if(rb) rb.addEventListener('click', function(){ setTimeout(refreshFromGist, 60); }, true);
});
})();
</script>
